# Publishes this site to GitHub Pages at lynnsealnaples.com on every push to main.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build pages from data and templates
        run: node build.js
      - name: Assemble the public folder
        run: |
          mkdir -p dist
          rsync -a ./ dist/ \
            --exclude .git --exclude .github --exclude dist --exclude dist-preview \
            --exclude screenshots --exclude templates --exclude tools --exclude data \
            --exclude build.js --exclude '*.md' --exclude '.gitignore'
          echo "lynnsealnaples.com" > dist/CNAME
          touch dist/.nojekyll
          du -sh dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
